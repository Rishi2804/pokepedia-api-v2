  minio:
    image: minio/minio:RELEASE.2022-11-11T03-44-20Z
    container_name: "pokepedia-image-store"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    env_file: .env
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      retries: 5
      timeout: 5s
  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      - minio
    volumes:
      - ./object_store/seed:/seed
      - ./object_store/init/init-minio.sh:/init-minio.sh
    entrypoint: [ "/bin/sh", "/init-minio.sh" ]
    env_file: .env
    restart: "no"
  redis:
    image: redis:7.4.2
    container_name: pokepedia-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      timeout: 5s
volumes:
  minio_data:
  postgres_data:
  redis_data: